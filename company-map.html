 if(comparisonView==='summary')comparisonSummary();else for(const operator of ['ours','pyat']){const heading=document.createElement('h2');heading.className='comparison-legend'+(operator==='pyat'?' is-pyat':'');heading.textContent=operator==='ours'?'Русский Разгуляйка · '+fleet:'Пятёрочка · 6';panel.append(heading);for(const route of routes().filter(r=>r.operator===operator))panel.append(row(route))}
}

function row(r){if(compare){const m=comparisonRoute(r),b=document.createElement('button');b.className='route-row is-detailed';b.dataset.routeKey=r.key;b.style.setProperty('--route-color',colors[r.operator]);b.setAttribute('aria-pressed',String(highlight===r.key));b.innerHTML='<span class="badge">'+(r.operator==='ours'?'Р':'П')+r.id+'</span><span><strong class="route-name">'+esc(r.title)+'</strong><span class="route-timing">'+clock(m.departure)+' → '+clock(m.arrival)+'<span class="route-basis">'+m.basis+'</span></span></span><span class="route-metrics">'+(m.basis==='Расчёт'?'≈ ':'')+m.duration+' мин · '+decimal(m.km)+' км · посадок: '+m.stops+(m.delay?'<span class="route-delay">Позже смены на '+m.delay+' мин</span>':'')+'</span>';b.onclick=()=>{highlight=r.key;renderPanel();schedule()};return b}const button=document.createElement('button');button.className='route-row';button.dataset.routeKey=r.key;button.style.setProperty('--route-color',colors[r.operator]);button.setAttribute('aria-pressed',String(compare?highlight===r.key:selected===r.id));const stat=r.operator==='ours'?(fleet===4?scenarios.baseline:scenarios.scenarios[fleet].stats).find(s=>s.id===r.id):null,duration=r.operator==='pyat'?r.duration:stat[shift];button.innerHTML='<span class="badge">'+(r.operator==='ours'?'Р':'П')+r.id+'</span><span><strong>'+esc(r.title)+'</strong><small>'+esc(r.operator==='pyat'?clock(r.stops[0][shift==='night'?'evening':'morning'])+' → '+(shift==='night'?'20:00':'08:00'):(shift==='night'?'К 19:45':'К 07:45'))+'</small></span><span class="route-duration">'+(r.operator==='ours'&&fleet>4&&stat.changed?'≈ ':'')+duration+' мин</span>';button.onclick=()=>{if(compare){highlight=r.key;renderPanel();schedule()}else{selected=r.id;render();fit()}};return button}
function renderPanel(){if(compare){renderDetailedComparison();return}panel.replaceChildren();const title=document.createElement('h1');title.textContent=compare?'Сравнение маршрутов':selected?pyat.routes.find(r=>r.id===selected).title:'Маршруты Пятёрочки';panel.append(title);const summary=document.createElement('p');summary.textContent=compare?'Красные — наши · зелёные — Пятёрочка':'РЦ · Енисейский тракт, 20-й км, 25Б';panel.append(summary);
 if(!compare&&selected){const back=document.createElement('button');back.className='back';back.textContent='← Все 6 маршрутов';back.onclick=()=>{selected=0;render();fit()};panel.append(back);const r=pyat.routes.find(r=>r.id===selected),stats=document.createElement('p');stats.textContent=r.duration+' мин · '+r.km+' км · '+r.stops.length+' остановок';panel.append(stats);const ol=document.createElement('ol');ol.className='stops';for(const[p,i]of r.stops.map((p,i)=>[p,i])){const li=document.createElement('li'),b=document.createElement('button');b.innerHTML='<span class="stop-no">'+(i+1)+'</span><span class="stop-name">'+esc(p.name)+(p.approximate?'<small>Ориентир: Белинского / Дубенского</small>':'')+'</span><span class="stop-time">'+clock(p[shift==='night'?'evening':'morning'])+'</span>';b.onclick=()=>focusStop(p,{...r,operator:'pyat'});li.append(b);ol.append(li)}panel.append(ol)}else for(const operator of(compare?['ours','pyat']:['pyat'])){if(compare){const h=document.createElement('h2');h.textContent=operator==='ours'?'Русский Разгуляйка · '+fleet+(fleet===4?' автобуса':' автобусов'):'Пятёрочка · 6 маршрутов';panel.append(h)}for(const r of routes().filter(r=>r.operator===operator))panel.append(row(r))}
 const source=document.createElement('details');source.className='source';source.innerHTML='<summary>О расписании и линиях</summary><p>Расписание Пятёрочки перенесено с трёх фотографий владельца. Прибытие в РЦ — 08:00 / 20:00.</p><p>Линии построены по дорогам между остановками. Точная трасса перевозчика и площадки посадки требуют сверки. «Белинского» — выбранный ориентир у Дубенского.</p><p>География: OpenStreetMap; построение: OSRM. Точка РЦ: <a href="https://yandex.ru/maps/org/245247831578/" target="_blank" rel="noopener">Енисейский тракт, 25Б</a>.</p>';panel.append(source)}
function render(){for(const b of document.querySelectorAll('[data-shift]'))b.setAttribute('aria-pressed',String(b.dataset.shift===shift));for(const b of document.querySelectorAll('[data-fleet]'))b.setAttribute('aria-pressed',String(+b.dataset.fleet===fleet));for(const b of $('#routeChoices').children)b.setAttribute('aria-pressed',String(+b.dataset.route===selected));renderPanel();$('#status').textContent=compare?'Наши: '+(shift==='night'?'19:45':'07:45')+' · Пятёрочка: '+(shift==='night'?'20:00':'08:00')+' · разные РЦ':'Расписание с фото · линии по дорогам между остановками';schedule()}
for(const b of document.querySelectorAll('[data-shift]'))b.onclick=()=>{shift=b.dataset.shift;$('#popup').hidden=true;render()};for(const b of document.querySelectorAll('[data-fleet]'))b.onclick=()=>{fleet=+b.dataset.fleet;highlight=null;render();fit()};
function zoom(factor,px=svg.clientWidth/2,py=svg.clientHeight/2){const w=Math.max(35,Math.min(6000,box.w*factor)),x=box.x+box.w*px/svg.clientWidth,y=box.y+box.h*py/svg.clientHeight;box.x=x-w*px/svg.clientWidth;box.y=y-w*py/svg.clientWidth;box.w=w;schedule()}
$('#zoomIn').onclick=()=>zoom(.7);$('#zoomOut').onclick=()=>zoom(1.4);$('#fit').onclick=()=>{selected=0;render();fit()};$('#togglePanel').onclick=()=>{panel.hidden=!panel.hidden;$('#togglePanel').setAttribute('aria-expanded',String(!panel.hidden));$('#togglePanel').setAttribute('aria-label',panel.hidden?'Показать расписание':'Скрыть расписание');fit()};
const touches=new Map();let pinch=null;svg.addEventListener('pointerdown',e=>{touches.set(e.pointerId,[e.clientX,e.clientY]);svg.setPointerCapture(e.pointerId);if(touches.size===1)drag={x:e.clientX,y:e.clientY,box:{...box}};if(touches.size===2){const [a,b]=[...touches.values()];pinch={distance:Math.hypot(a[0]-b[0],a[1]-b[1]),width:box.w};drag=null}});svg.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===2&&pinch){const[a,b]=[...touches.values()],distance=Math.hypot(a[0]-b[0],a[1]-b[1]),rect=svg.getBoundingClientRect();zoom(pinch.width*pinch.distance/distance/box.w,(a[0]+b[0])/2-rect.left,(a[1]+b[1])/2-rect.top)}else if(drag){box.x=drag.box.x-(e.clientX-drag.x)*box.w/svg.clientWidth;box.y=drag.box.y-(e.clientY-drag.y)*box.w/svg.clientWidth;schedule()}});for(const type of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(type,e=>{touches.delete(e.pointerId);drag=null;pinch=null});svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(e.deltaY*.001),e.clientX-r.left,e.clientY-r.top)},{passive:false});new ResizeObserver(()=>fit()).observe(svg);window.addEventListener('resize',fit);dark.addEventListener('change',schedule);
Promise.all(['./pyaterochka-routes.json?v=20261109','./magistral-routes.json','./fleet-scenarios.json'].map(url=>fetch(url).then(r=>{if(!r.ok)throw Error('Не удалось загрузить маршруты');return r.json()}))).then(([p,o,s])=>{pyat=p;ours=o;scenarios=s;$('#fleet').hidden=!compare;$('.legend').hidden=!compare;$('#routeChoices').hidden=compare;document.title=compare?'Сравнение маршрутов · Красноярск':'Маршруты Пятёрочки · Красноярск';svg.setAttribute('aria-label',compare?'Карта сравнения: наши маршруты красные, Пятёрочка зелёные':'Карта шести маршрутов Пятёрочки');if(compare)for(const b of document.querySelectorAll('[data-shift]'))b.textContent=b.dataset.shift==='day'?'☀ Утро':'☾ Вечер';else for(const id of [0,1,2,3,4,5,6]){const b=document.createElement('button');b.dataset.route=id;b.textContent=id?'П'+id:'Все';b.title=id?pyat.routes.find(r=>r.id===id).title:'Все маршруты';b.onclick=()=>{selected=id;$('#popup').hidden=true;render();fit()};$('#routeChoices').append(b)}render();fit()}).catch(e=>{panel.innerHTML='<h1>Маршруты не загрузились</h1><p>Обновите страницу, чтобы повторить загрузку.</p>';$('#status').textContent=e.message});
})();
